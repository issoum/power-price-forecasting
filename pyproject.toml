[project]
name = "powerfc"
version = "0.1.0"
description = "Day-ahead electricity price forecasting and forecast-driven battery arbitrage"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy",
    "scipy",
    "scikit-learn>=1.3",
    "requests",
    "pyarrow",
    "holidays",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
